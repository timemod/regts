# Workflow rules to prevent duplicate pipelines:
# - Use MR pipeline when a merge request exists
# - Use branch pipeline otherwise
# This ensures only one pipeline runs per commit
workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH

variables:
  BUILD_DIR: build
  R_PROFILE_USER: "$CI_PROJECT_DIR/ci_scripts/Rprofile.ci"
  # define the development and test version of R
  R_DEV: "4.5.1"
  R_PROD: "4.5.1"

stages:
    - build
    - test
    - test_with_cpblib

before_script:
    - Rscript_$R_DEV -e "cat('library-paths:\n');print(.libPaths())"

build-job:
  stage: build
  variables:
    USE_CPBLIB: "false"
  script:
    # The package is build and tested using a the local packages of gitlab-runner.
    - Rscript_$R_DEV ci_scripts/prepare_local_lib.R
    - R_$R_DEV CMD build pkg
    - mkdir -p $BUILD_DIR
    - mv *.tar.gz $BUILD_DIR
      # Install the package in the local library
    - R_$R_DEV CMD INSTALL $BUILD_DIR/*.tar.gz
  artifacts:
    paths:
      - build

Check package:
  stage: test
  variables:
    USE_CPBLIB: "false"
  script:
    - R_$R_DEV CMD check $BUILD_DIR/*.tar.gz

Lint package:
  stage: test
  variables:
    USE_CPBLIB: "false"
  script:
    - Rscript ci_scripts/lint_pkg.R

Test package in cpblib:
  stage: test_with_cpblib
  variables:
    REGTS_LIB: "$CI_PROJECT_DIR/regtslib"
  before_script:
  script:

    # Step 1: install regts in directory regtslib.

    # First make sure that all required packages are need for this R-version,
    # this is required if R_PROD != R_DEV.
    - export USE_CPBLIB=false
    - Rscript_$R_PROD ci_scripts/prepare_local_lib.R
    - mkdir -p $R_LIBS_USER
    - R_$R_PROD CMD INSTALL --preclean --clean -l $REGTS_LIB $BUILD_DIR/*.tar.gz
    - ls -l $REGTS_LIB

    # Now use cpblib to test regts
    - export R_LIBS_USER=$REGTS_LIB
    - export USE_CPBLIB=true
    - Rscript_$R_PROD -e 'pkgs <- dir(Sys.getenv("R_LIBS_USER")); print(pkgs); if (!identical(pkgs, "regts")) stop("Expected only regts")'
    - Rscript_$R_PROD -e "cat('library-paths:\n');print(.libPaths())"
    - Rscript_$R_PROD -e "testthat::test_package('regts', stop_on_failure = TRUE)"

  rules:
    # Sometimes this check should be skipped (when regts
    # needs versions of packages not in cpblib)
    - if: '$test_within_cpblib == "skip"'
      when: never
    - when: on_success

